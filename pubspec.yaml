name: bubble_talk
description: "버블톡 - GetX 기반 1:1 채팅 앱 (목업 데이터)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리 · 라우팅 · DI
  get: ^4.7.2

  # BaseView / BaseController / BaseBinding / PageState
  getx_starter_kit:
    git:
      url: https://github.com/jjwwii/getx-starter-kit.git
      ref: master
  flutter_local_notifications: ^23.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# 앱 아이콘: tool/generate_app_icon_test.dart 로 PNG 를 만든 뒤
#   fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # 전경 PNG 에 이미 안전 영역 여백을 넣었으므로 추가 여백은 두지 않는다.
  adaptive_icon_foreground_inset: 0
